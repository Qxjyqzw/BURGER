[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "burger"
version = "0.1.0"
description = "BURGER robotic drawing data generation across ManiSkill, LIBERO, and Isaac Sim"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*.txt", "THIRD_PARTY_NOTICES.md"]
dependencies = [
  "numpy>=1.24",
  "h5py>=3.8",
  "Pillow>=10",
  "scipy>=1.10",
  "svgpathtools>=1.6",
]

[project.optional-dependencies]
preprocess = ["scikit-image>=0.22", "opencv-python-headless>=4.8", "networkx>=3.1"]
test = ["pytest>=8"]

[project.scripts]
burger = "burger.cli:main"
burger-generate = "burger.pipeline.generate:main"
burger-export = "burger.data.exporters.export:main"

[tool.setuptools.packages.find]
include = ["burger", "burger.*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"burger.pipeline" = ["assets/**/*"]
"burger.backends.isaac" = ["assets/**/*"]
"burger.backends.libero" = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["export: real LeRobot writer and dataset readback (requires the export environment)"]
